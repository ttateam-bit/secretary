<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_blank">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2049">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سكرتيري">
<title>سكرتيري الشخصي (محمد)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>/* يعرض أي خطأ برمجي داخل الصفحة بدل التوقف الصامت */window.onerror=function(msg,src,line,col){var t=function(){var el=document.getElementById("view");if(el){el.className="";el.innerHTML="<div style=\"padding:20px;color:#A31545;font-weight:700\">خطأ في الصفحة: "+msg+" (سطر "+line+":"+col+")</div>";}};if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",t);}else{t();}};</script>
<style>
  :root{
    --ivory:#F7F7F7; --cream:#FAFAE3; --navy:#0B2049; --navy2:#110133;
    --teal:#00918E; --teal-soft:#E6F4F4; --crimson:#A31545; --crimson-soft:#FBEAF0;
    --line:#E3E6EC; --muted:#5B6578; --white:#fff; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--ivory);color:var(--navy);font-size:15px;line-height:1.6}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--navy)}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* الشريط العلوي */
  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--teal) 100%);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(11,32,73,.18)}
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
  .top h1{font-size:18px;margin:0;font-weight:800}
  .top p{margin:0;font-size:12px;opacity:.85}
  .qlinks{display:flex;flex-wrap:wrap;gap:6px}
  .qlinks a{font-size:12px;font-weight:700;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
  .qlinks a.main{background:var(--teal);border-color:var(--teal)}
  nav{background:#fff;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:6px 13px;border-radius:10px;font-weight:700;font-size:13px;color:#334}
  .tab:hover{background:var(--ivory)}
  .tab.on{background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(0,145,142,.25)}
  .tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:4px;border-radius:9px;background:var(--crimson);color:#fff;font-size:11px;line-height:18px;text-align:center}

  main{padding:18px 0 90px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(11,32,73,.04)}
  .stack>*+*{margin-top:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:900px){.grid4{grid-template-columns:1fr 1fr}}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  @media (max-width:480px){.grid4{grid-template-columns:1fr}}
  .grid2>*,.grid4>*,.cols>*{min-width:0}
  .pbox{overflow:hidden}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .h2{font-size:18px;font-weight:800;margin:0}
  .h3{font-size:15px;font-weight:800;margin:0}
  .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
  .small{font-size:12px;color:var(--muted)}
  .sep{border:0;border-top:1px solid var(--line);margin:10px 0}
  .empty{font-size:13px;color:var(--muted);padding:8px 0}

  .btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:8px 14px;border-radius:12px;transition:.15s}
  .btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--teal)}
  .btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--navy)}
  .btn-ghost{background:var(--ivory);color:var(--navy);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--teal)}
  .btn-cream{background:var(--cream);border:1px solid rgba(0,145,142,.35)}.btn-cream:hover{background:var(--teal);color:#fff}
  .btn-red{color:var(--crimson);font-weight:700;font-size:12px}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:9px}
  .link{color:var(--teal);font-weight:700;font-size:12px}
  .icon-btn{font-size:13px;padding:3px 6px;border-radius:7px;color:var(--muted)}
  .icon-btn:hover{background:var(--ivory);color:var(--navy)}

  /* الرئيسية */
  .hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
  .hero .date{font-size:24px;font-weight:800;margin:0}
  .hero .hijri{font-size:13px;color:var(--teal);font-weight:700}
  .alert{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
  .alert-red{background:var(--crimson-soft);color:var(--crimson);border:1px solid rgba(163,21,69,.25)}
  .alert-teal{background:var(--teal-soft);color:var(--navy);border:1px solid rgba(0,145,142,.3)}
  .count{font-size:12px;font-weight:700;padding:1px 10px;border-radius:20px;background:var(--cream);border:1px solid var(--line)}

  .task{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--ivory)}
  .task+.task{margin-top:8px}
  .task input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
  .task .t{flex:1;font-weight:700;font-size:14px}
  .task.done .t{text-decoration:line-through;color:#9aa3b2;font-weight:400}
  .task .carried{font-size:11px;color:var(--crimson);font-weight:700}
  .addline{display:flex;gap:6px;margin-top:10px}
  .addline input{flex:1}

  .meet{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--cream)}
  .meet+.meet{margin-top:8px}
  .meet.soon{border-color:var(--teal);box-shadow:0 0 0 2px rgba(0,145,142,.15)}
  .meet .when{color:var(--teal);font-weight:800}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:#fff;border:1px solid var(--line);color:#334}
  .chip.ok{border-color:rgba(0,145,142,.45);color:var(--teal)}
  .chip.hot{background:var(--teal);color:#fff;border-color:var(--teal)}
  .chip.red{background:var(--crimson-soft);color:var(--crimson);border-color:rgba(163,21,69,.3)}

  .pbox{text-align:right;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;transition:.15s;display:block}
  .pbox:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 20px rgba(11,32,73,.08)}
  .pbox .nm{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
  .pbox p{margin:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbox b.a{color:var(--teal)} .pbox b.b{color:var(--navy)}
  .reddot{width:9px;height:9px;border-radius:50%;background:var(--crimson);display:inline-block}

  /* بطاقة الاتفاق */
  .agr{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px}
  .agr+.agr{margin-top:10px}
  .agr.late{border-color:rgba(163,21,69,.45);background:#fff}
  .agr.isdone{opacity:.65;background:#fff}
  .agr .who{font-weight:800}
  .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:7px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .status{font-size:12px;font-weight:800;padding:3px 11px;border-radius:20px;border:1px solid transparent}
  .st-new{background:#E8EEF8;color:var(--navy);border-color:#cdd8ec}
  .st-doing{background:var(--teal-soft);color:#00706d;border-color:rgba(0,145,142,.35)}
  .st-done{background:var(--teal);color:#fff}
  .agr .lbl{font-size:12px;color:var(--muted);margin:6px 0 0}
  .agr .exp{font-size:14px;font-weight:700;margin:4px 0 0}
  .bar{height:6px;background:#e9ecf1;border-radius:6px;overflow:hidden;margin:10px 0 4px}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
  .items{margin:6px 0 0;padding:0;list-style:none}
  .items li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13.5px}
  .items li input{width:17px;height:17px;margin-top:3px;accent-color:var(--teal);flex-shrink:0}
  .items li.d span{text-decoration:line-through;color:#9aa3b2}
  .items li .x{margin-inline-start:auto;opacity:0;color:var(--crimson);font-size:12px}
  .items li:hover .x{opacity:1}
  @media (hover:none){.items li .x{opacity:.5}}
  .agr .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(11,32,73,.08);margin-top:10px;padding-top:8px;font-size:12px;color:var(--muted)}
  .due-late{color:var(--crimson);font-weight:800}
  .group-h{font-weight:800;font-size:15px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
  .group-h .n{font-size:11px;font-weight:700;color:var(--muted)}
  .grp+.grp{margin-top:18px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{background:var(--ivory);color:var(--muted);text-align:right;padding:9px;font-weight:700;border-bottom:1px solid var(--line)}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tblwrap{overflow-x:auto}

  /* المراجعة */
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800}
  .stat span{font-size:12px;color:var(--muted)}
  .rrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .rrow:last-child{border-bottom:0}

  /* النوافذ */
  .overlay{position:fixed;inset:0;background:rgba(17,1,51,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:60;overflow-y:auto}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:620px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal .mh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .inp{width:100%;border:1px solid #cfd5df;border-radius:11px;padding:8px 11px;background:#fff}
  .inp:focus{outline:2px solid rgba(0,145,142,.35);border-color:var(--teal)}
  textarea.inp{resize:vertical;min-height:64px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.f2{grid-template-columns:1fr}}
  .mfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
  .edit-item{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .edit-item input[type=text]{flex:1}
  .edit-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal)}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .menu-grid button{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px 10px;font-weight:800;font-size:14px}
  .menu-grid button:hover{border-color:var(--teal);background:var(--teal-soft)}
  .menu-grid button span{display:block;font-size:24px;color:var(--teal);margin-bottom:4px}
  .prop{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--ivory)}
  .prop.off{opacity:.45}
  .mic{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
  .mic.rec{background:var(--crimson);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(163,21,69,.5)}100%{box-shadow:0 0 0 14px rgba(163,21,69,0)}}
  details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--teal)}

  .fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,145,142,.45);z-index:40}
  .fab:hover{background:var(--navy)}
  #toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw}
  #toast.on{opacity:1}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-weight:700}
  .saving{position:fixed;top:8px;left:8px;background:#fff;color:var(--teal);font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;z-index:90;display:none;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .saving.on{display:block}

  /* ===== التحسينات: أيقونات، بطاقة «التالي»، شريط سفلي للهاتف ===== */
  .ic{display:inline-block;vertical-align:-3px;flex-shrink:0}
  .tab{display:inline-flex;align-items:center;gap:6px}
  .qlinks a{display:inline-flex;align-items:center;gap:5px}
  .focus{display:grid;grid-template-columns:auto 1fr;gap:0;padding:0;overflow:hidden}
  .focus .day{background:var(--navy);color:#fff;padding:18px 20px;min-width:190px;display:flex;flex-direction:column;justify-content:center}
  .focus .day .wd{font-size:14px;opacity:.8;font-weight:700}
  .focus .day .dn{font-size:44px;font-weight:800;line-height:1.1}
  .focus .day .mo{font-size:15px;font-weight:700}
  .focus .day .hj{font-size:12px;color:#7fd6d3;margin-top:6px;font-weight:700}
  .focus .next{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .focus .lbl2{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:.2px}
  .focus .nt{font-size:19px;font-weight:800;margin:0}
  .focus .cd{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);background:var(--teal-soft);border-radius:10px;padding:3px 10px;font-size:13px}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--ivory);border:1px solid var(--line)}
  .pill b{font-size:14px}
  .pill.red{background:var(--crimson-soft);color:var(--crimson);border-color:rgba(163,21,69,.25)}
  @media (max-width:640px){
    .focus{grid-template-columns:1fr}
    .focus .day{flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px;min-width:0}
    .focus .day .dn{font-size:30px}
  }
  .dayhead{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
  .dayhead:first-child{margin-top:0}
  .dayhead::after{content:'';flex:1;border-top:1px dashed var(--line)}
  .meet{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
  .meet .tm{font-weight:800;font-size:13px;color:var(--teal);text-align:center;background:#fff;border-radius:10px;padding:6px 2px;border:1px solid var(--line);line-height:1.3}
  .meet .tm small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:900px){.strip{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){
    .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -16px;padding-inline:16px}
    .strip .pbox{flex:0 0 78%;scroll-snap-align:start}
  }
  .add-toggle{font-size:12px;font-weight:700;color:var(--teal);margin-top:6px;display:inline-flex;align-items:center;gap:4px}
  .addline.hide{display:none}
  .status{display:inline-flex;align-items:center;gap:4px}
  .status::after{content:'⟲';font-size:11px;opacity:.6}

  /* شريط الهاتف السفلي */
  .bnav{display:none}
  @media (max-width:760px){
    nav{display:none}
    .top{padding-block:9px;flex-wrap:nowrap}
    .top>div:first-child{min-width:0;flex:1}
    .top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .qlinks{flex-wrap:nowrap}
    main{padding-top:14px}
    .top p{display:none}
    .qlinks a span{display:none}
    .qlinks a{padding:7px 9px}
    .fab{display:none}
    main{padding-bottom:96px}
    .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(11,32,73,.06)}
    .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
    .bnav button.on{color:var(--teal)}
    .bnav .mid{width:50px;height:50px;border-radius:50%;background:var(--teal);color:#fff;margin:-22px auto 0;box-shadow:0 6px 16px rgba(0,145,142,.4);justify-content:center}
    .bnav .dot{position:absolute;top:0;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--crimson);color:#fff;font-size:10px;line-height:16px;text-align:center}
    #toast{bottom:84px}
  }
  .sec-list{display:grid;gap:8px}
  .sec-list button{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--ivory);font-weight:800;font-size:15px;text-align:right}
  .sec-list button.on{border-color:var(--teal);background:var(--teal-soft)}
  .sec-list button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
  .sec-list .n{margin-inline-start:auto;font-size:11px;background:var(--crimson);color:#fff;border-radius:9px;padding:0 7px}
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <div>
      <h1>سكرتيري الشخصي (محمد)</h1>
      <p>ماذا سُلِّم؟ ماذا اتفقنا؟ ماذا نُفذ؟ وماذا بقي؟</p>
    </div>
    <div class="qlinks" id="qlinks"></div>
  </div>
  <nav><div class="wrap tabs" id="tabs"></div></nav>
</header>

<main class="wrap"><div id="view" class="loading">جارٍ تحميل البيانات…</div></main>

<button class="fab" id="fab" title="إضافة" target="_self">+</button>
<div class="bnav" id="bnav"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div class="saving" id="saving">جارٍ الحفظ…</div>

<script>
/* =====================================================================
   الإعدادات الثابتة (الروابط والأقسام)
   ===================================================================== */
const LINKS = {
  notebooks: 'https:\/\/sites.google.com/view/mwnotebooks?usp=sharing',
  sheet: 'https:\/\/docs.google.com/spreadsheets/d/1v_OPMesVtNF12aPfcEmi3yJxGQ9OhrwJP8RsNsCs7gI/edit',

// الرمز السري يصل مرة واحدة عبر الرابط (#k=...) ثم يُحفظ في الجهاز ويُمسح من شريط العنوان
(function () {
  const m = location.hash.match(/[#&]k=([A-Za-z0-9]+)/);

})();
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };

function applyLocal(data, ops) {
  (ops || []).forEach(o => {
    const arr = data[o.table] || (data[o.table] = []);
    if (o.op === 'upsert') {
      const i = arr.findIndex(x => x.id === o.row.id);
      if (i >= 0) arr[i] = Object.assign({}, o.row); else arr.push(Object.assign({}, o.row));
    } else if (o.op === 'delete') {
      data[o.table] = arr.filter(x => x.id !== o.id);
    }
  });
  return data;
}
const Mock = {
  KEY: 'mw_secretary_preview',
  load() {
    try { const r = localStorage.getItem(this.KEY); if (r) return JSON.parse(r); } catch (e) {}
    const s = JSON.parse(JSON.stringify(window.__SEED || { people: [], agreements: [], items: [], meetings: [], tasks: [], books: [] }));
    s.settings = { hasKey: false, model: 'gemini-flash-latest' };

  },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} }
};
async function remote(fn, ...args) {
  const token = getToken();
  if (!token) throw 'هذا الجهاز غير مربوط بعد.';
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token, fn, args }) });
  } catch (e) { throw 'لا يوجد اتصال بالإنترنت أو الخادم لا يستجيب.'; }
  let j;
  try { j = await res.json(); } catch (e) { throw 'ردّ غير متوقع من الخادم (تأكد أن النشر على «أي شخص»).'; }
  if (!j.ok) throw j.error;
  return j.data;
}

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const parseYmd = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };

function fmtDay(s) {
  const d = parseYmd(s); if (!d) return '';
  return DAYS[d.getDay()] + ' ' + ar(d.getDate()) + ' ' + MONTHS[d.getMonth()];
}
function fmtTime(t) {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  const pm = h >= 12; h = h % 12 || 12;
  return ar(h + ':' + pad(m)) + (pm ? ' م' : ' ص');
}
function relDay(s) {
  const t = today();
  if (s === t) return 'اليوم';
  if (s === addDays(t, 1)) return 'غداً';
  if (s === addDays(t, -1)) return 'أمس';
  return fmtDay(s);
}

   ===================================================================== */
const activeAgr = () => D.agreements.filter(a => !a.archivedAt);
const itemsOf = id => D.items.filter(i => i.agreementId === id).sort((a, b) => (+a.order || 0) - (+b.order || 0));
const progress = a => { const it = itemsOf(a.id); return { done: it.filter(i => i.done).length, total: it.length }; };
const isOpen = a => !a.archivedAt && a.status !== 'منجز';
const isLate = a => isOpen(a) && a.dueDate && a.dueDate < today();
const touched = a => Object.assign({}, a, { updatedAt: nowIso() });

function autoStatus(a, items) {
  const total = items.length, done = items.filter(i => i.done).length;
  if (!total) return a.status;
  if (done === total) return 'منجز';
  if (a.status === 'منجز') return 'قيد التنفيذ';
  if (done > 0 && a.status === 'جديد') return 'قيد التنفيذ';
  return a.status;
}
function toggleItem(itemId, checked) {
  const it = D.items.find(i => i.id === itemId); if (!it) return;
  const a = D.agreements.find(x => x.id === it.agreementId);
  const newIt = Object.assign({}, it, { done: checked, doneAt: checked ? nowIso() : '' });
  const all = itemsOf(a.id).map(i => i.id === itemId ? newIt : i);
  const st = autoStatus(a, all);
  const ops = [{ op: 'upsert', table: 'items', row: newIt }, { op: 'upsert', table: 'agreements', row: Object.assign(touched(a), { status: st }) }];
  save(ops, st === 'منجز' && a.status !== 'منجز' ? '🎉 اكتملت كل بنود هذا الاتفاق' : (checked ? '✓ نُفذ' : 'أُعيد إلى «بقي»'));
}
function cycleStatus(id) {
  const a = D.agreements.find(x => x.id === id); if (!a) return;
  const next = STATUSES[(STATUSES.indexOf(a.status) + 1) % STATUSES.length];
  save([{ op: 'upsert', table: 'agreements', row: Object.assign(touched(a), { status: next }) }], 'الحالة: ' + next);
}
function addItem(agrId, text) {
  text = text.trim(); if (!text) return;
  const a = D.agreements.find(x => x.id === agrId);
  const order = itemsOf(agrId).length + 1;
  const row = { id: uid('i'), agreementId: agrId, text, done: false, doneAt: '', order };
  const ops = [{ op: 'upsert', table: 'items', row }];
  if (a.status === 'منجز') ops.push({ op: 'upsert', table: 'agreements', row: Object.assign(touched(a), { status: 'قيد التنفيذ' }) });
  else ops.push({ op: 'upsert', table: 'agreements', row: touched(a) });
  save(ops, 'أُضيف البند');
}
function deleteItem(itemId) {
  save([{ op: 'delete', table: 'items', id: itemId }], 'حُذف البند');
}

    if (!ok) return;
    const ops = itemsOf(id).map(i => ({ op: 'delete', table: 'items', id: i.id }));
    ops.push({ op: 'delete', table: 'agreements', id });

}

function occurrence(m, from) {
  from = from || new Date();
  const allDay = !m.start;
  const [sh, sm] = (m.start || '00:00').split(':').map(Number);
  const [eh, em] = (m.end || m.start || '23:59').split(':').map(Number);
  const mk = (base) => {
    const s = new Date(base); s.setHours(allDay ? 0 : sh, allDay ? 0 : sm, 0, 0);
    const e = new Date(base); if (allDay) e.setHours(23, 59, 0, 0); else e.setHours(eh, em, 0, 0);
    if (e <= s) e.setTime(s.getTime() + 3600000);
    return { start: s, end: e, allDay };
  };
  if (m.kind === 'مرة واحدة') {
    if (!m.date) return null;
    return mk(parseYmd(m.date));
  }
  if (m.weekday === '' || m.weekday == null) return null;
  for (let i = 0; i < 8; i++) {
    const d = new Date(from); d.setDate(d.getDate() + i);
    if (d.getDay() === +m.weekday) { const o = mk(d); if (o.end > from) return o; }
  }
  return null;
}
function meetingsFor(sections) {
  return D.meetings.filter(m => sections.includes(m.section));
}
function upcoming(days) {
  const now = new Date(), lim = new Date(now.getTime() + days * 86400000);
  const list = [];
  D.meetings.forEach(m => {
    const o = occurrence(m, now);
    if (o && o.start <= lim && o.end > now) list.push({ m, o });
  });
  return list.sort((a, b) => a.o.start - b.o.start);
}
function timeRange(m, o) {
  if (!o || o.allDay) return 'الوقت غير محدد';
  return fmtTime(m.start) + (m.end && m.kind !== 'تذكير أسبوعي' ? '–' + fmtTime(m.end) : '');
}
function whenText(m, o) {
  if (!o) return m.kind === 'مرة واحدة' ? 'الموعد قيد التحديد' : '';
  return relDay(ymd(o.start)) + ' • ' + timeRange(m, o);
}
function countdown(o) {
  if (!o) return '';
  const now = new Date();
  if (o.allDay) return ymd(o.start) === today() ? 'اليوم — الوقت غير محدد' : relDay(ymd(o.start)) + ' — الوقت غير محدد';
  const mins = Math.round((o.start - now) / 60000);
  if (mins <= 0 && o.end > now) return 'جارٍ الآن';
  if (mins < 60) return 'بعد ' + ar(mins) + ' دقيقة';
  const h = Math.floor(mins / 60), mm = mins % 60;
  if (h < 24) return 'بعد ' + ar(h) + ' ساعة' + (mm ? ' و' + ar(mm) + ' دقيقة' : '');
  return relDay(ymd(o.start)) + ' • ' + fmtTime(ymdTime(o.start));
}
const ymdTime = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

function meetingCard(m, o, opts) {
  o = o === undefined ? occurrence(m) : o;
  opts = opts || {};
  const hrs = o && !o.allDay ? (o.start - new Date()) / 3600000 : null;
  const isRem = m.kind === 'تذكير أسبوعي';
  let hot = '';
  if (hrs !== null && hrs <= 2 && hrs > -3) hot = `<span class="chip hot">${ic('clock', 12)} خلال ساعتين</span>`;
  else if (hrs !== null && hrs <= 12 && hrs > 0 && !isRem) hot = `<span class="chip hot">${ic('bell', 12)} وقت التحضير</span>`;
  const inCal = !!m.calEventId;
  const timeBox = o && !o.allDay ? `${fmtTime(m.start)}${opts.showDay ? `<small>${relDay(ymd(o.start))}</small>` : ''}`
                : `<span style="font-size:11px">${o ? 'بلا وقت' : 'غير محدد'}</span>${o && opts.showDay ? `<small>${relDay(ymd(o.start))}</small>` : ''}`;
  return `<div class="meet ${hot ? 'soon' : ''}">
    <div class="tm">${timeBox}</div>
    <div style="min-width:0">
      <div class="between" style="flex-wrap:nowrap;align-items:flex-start">
        <div style="min-width:0">
          <div class="h3">${isRem ? ic('send', 14) + ' ' : ''}${esc(m.title)}</div>
          <div class="small">${esc(m.person)}${o && !o.allDay && m.end && !isRem ? ' • حتى ' + fmtTime(m.end) : ''}${m.kind !== 'مرة واحدة' ? ' • كل ' + DAYS[+m.weekday] : ''}</div>
        </div>
        <button class="icon-btn" data-act="edit-meeting" data-id="${m.id}" title="تعديل أو حذف" target="_self">${ic('edit', 15)}</button>
      </div>
      ${m.prep ? `<div class="small" style="margin-top:3px">${isRem ? '' : '<b>التحضير:</b> '}${esc(m.prep)}</div>` : ''}
      <div class="row" style="margin-top:7px">
        ${hot}
        <button class="btn btn-sm" style="background:#e6f6ee;color:#0d7a5f" data-act="wa-meet" data-id="${m.id}" target="_self">${ic('send', 13)} رسالة</button>
        ${o ? (inCal ? `<span class="chip ok">${ic('check', 12)} في تقويمك${isRem || o.allDay ? '' : ' • تذكير ١٢س + ٢س'}</span>`
                     : `<button class="btn btn-navy btn-sm" data-act="to-cal" data-id="${m.id}" target="_self">${ic('cal', 13)} أضِف لتقويمي${isRem || o.allDay ? '' : ' (١٢س + ٢س)'}</button>`) : ''}
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   بطاقات الأشخاص (تُحسب تلقائياً)
   ===================================================================== */
function agrsOfBox(p) {
  return activeAgr().filter(a => p.match === 'قسم' ? a.section === p.section : a.person === p.name);
}
function boxInfo(p) {
  const now = new Date();
  let meets = D.meetings.filter(m => m.kind !== 'تذكير أسبوعي' && m.person && m.person.includes(p.name));
  if (!meets.length) meets = D.meetings.filter(m => m.kind !== 'تذكير أسبوعي' && m.section === p.section);
  let next = null;
  meets.forEach(m => { const o = occurrence(m, now); if (o && (!next || o.start < next.o.start)) next = { m, o }; });
  const undated = meets.find(m => !occurrence(m, now));
  const nextTxt = next ? whenText(next.m, next.o) : (undated ? esc(undated.title) + ' (قيد التحديد)' : 'لا يوجد اجتماع محدد');

  const open = agrsOfBox(p).filter(isOpen).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  let taskTxt = 'لا توجد اتفاقات مفتوحة ✓';
  if (open.length) {
    const a = open[0], it = itemsOf(a.id), rest = it.filter(i => !i.done);
    taskTxt = esc(rest.length ? rest[0].text : a.expected);
    if (it.length) taskTxt += ` (بقي ${ar(rest.length)} من ${ar(it.length)})`;
  }
  return { nextTxt, taskTxt, late: open.some(isLate), open: open.length };
}

  const stc = a.status === 'منجز' ? 'st-done' : a.status === 'قيد التنفيذ' ? 'st-doing' : 'st-new';
  const late = isLate(a);
  return `<div class="agr ${late ? 'late' : ''} ${a.status === 'منجز' ? 'isdone' : ''}">
    <div class="between">
      <div class="row">${a.track ? `<span class="tag">${esc(a.track)}</span>` : ''}${late ? '<span class="chip red">متأخر</span>' : ''}</div>
      <button class="status ${stc}" data-act="cycle" data-id="${a.id}" title="انقر لتغيير الحالة: جديد ← قيد التنفيذ ← منجز" target="_self">${esc(a.status)}</button>

    <ul class="items">
      ${it.map(i => `<li class="${i.done ? 'd' : ''}"><input type="checkbox" data-act="item" data-id="${i.id}" ${i.done ? 'checked' : ''}><span>${esc(i.text)}</span><button class="x" data-act="del-item" data-id="${i.id}" target="_self">حذف</button></li>`).join('')}

function sortAgr(list) {
  const rank = a => isLate(a) ? 0 : isOpen(a) ? 1 : 2;
  return list.sort((a, b) => rank(a) - rank(b) || (a.dueDate || '9').localeCompare(b.dueDate || '9'));
}

function viewReview() {
  const t = today(), wk = addDays(t, 7), ago = addDays(t, -7);
  const act = activeAgr();
  const open = act.filter(isOpen);
  const late = sortAgr(act.filter(isLate));
  const soon = sortAgr(open.filter(a => a.dueDate && a.dueDate >= t && a.dueDate <= wk));
  const doneItems = D.items.filter(i => i.done && i.doneAt && i.doneAt.slice(0, 10) >= ago);
  const stale = open.filter(a => (a.updatedAt || '').slice(0, 10) < ago);
  const finished = act.filter(a => a.status === 'منجز');
  const archived = D.agreements.filter(a => a.archivedAt).sort((a, b) => b.archivedAt.localeCompare(a.archivedAt));

  const agrRow = a => { const p = progress(a); return `<div class="rrow"><div><b>${esc(a.person)}</b> <span class="small">(${esc(a.section)})</span><br>${esc(a.expected)}${p.total ? ` <span class="small">— بقي ${ar(p.total - p.done)} من ${ar(p.total)}</span>` : ''}</div>

  const byPerson = {};
  doneItems.forEach(i => { const a = D.agreements.find(x => x.id === i.agreementId); const k = a ? a.person : '—'; (byPerson[k] = byPerson[k] || []).push(i); });

  return `<div class="stack">
    <div class="card between">
      <div><h2 class="h2">${ic('chart', 20)} المراجعة الأسبوعية</h2><p class="sub">من ${fmtDay(ago)} إلى ${fmtDay(t)} — ماذا نُفذ؟ ماذا بقي؟ ماذا تأخر؟</p></div>
      <div class="row">
        <button class="btn btn-ghost btn-sm" data-act="copy-summary" target="_self">${ic('copy', 14)} نسخ ملخص الأسبوع</button>
        <button class="btn btn-navy btn-sm" data-act="archive-done" target="_self" ${finished.length ? '' : 'disabled style="opacity:.5"'}>${ic('archive', 14)} أرشفة المنجز (${ar(finished.length)})</button>
      </div>
    </div>
    <div class="grid4">
      <div class="stat"><b>${ar(open.length)}</b><span>اتفاق مفتوح</span></div>
      <div class="stat"><b style="color:var(--crimson)">${ar(late.length)}</b><span>متأخر</span></div>
      <div class="stat"><b>${ar(soon.length)}</b><span>يستحق خلال ٧ أيام</span></div>
      <div class="stat"><b style="color:var(--teal)">${ar(doneItems.length)}</b><span>بند نُفذ هذا الأسبوع</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h3 class="h3" style="color:var(--crimson)">${ic('alert')} متأخر عن موعده</h3><hr class="sep">${late.length ? late.map(agrRow).join('') : '<div class="empty">لا شيء متأخر ✓</div>'}</div>
      <div class="card"><h3 class="h3">${ic('cal')} يستحق خلال الأيام السبعة</h3><hr class="sep">${soon.length ? soon.map(agrRow).join('') : '<div class="empty">لا مواعيد قريبة.</div>'}</div>
      <div class="card"><h3 class="h3" style="color:var(--teal)">${ic('check')} ما نُفذ خلال الأسبوع</h3><hr class="sep">
        ${Object.keys(byPerson).length ? Object.keys(byPerson).map(k => `<div class="rrow"><div><b>${esc(k)}</b><br>${byPerson[k].map(i => '✓ ' + esc(i.text)).join('<br>')}</div></div>`).join('') : '<div class="empty">لم يُعلَّم أي بند منجزاً هذا الأسبوع.</div>'}</div>
      <div class="card"><h3 class="h3">${ic('clock')} لم يتحرك منذ أسبوع</h3><hr class="sep">${stale.length ? stale.map(agrRow).join('') : '<div class="empty">كل الاتفاقات المفتوحة تحرّكت مؤخراً.</div>'}</div>
    </div>
    <div class="card">
      <details>
        <summary>${ic('archive', 14)} الأرشيف (${ar(archived.length)}) — الاتفاقات المغلقة</summary>
        <div style="margin-top:10px">
          <a class="link" href="${LINKS.archive}">${ic('folder', 13)} مجلد الأرشيف في درايف</a>
          ${archived.length ? archived.map(a => `<div class="rrow"><div><b>${esc(a.person)}</b> <span class="small">(${esc(a.section)})</span><br>${esc(a.expected)}<br><span class="small">أُرشف ${fmtDay(a.archivedAt.slice(0, 10))}</span></div>
            <button class="link" data-act="unarchive" data-id="${a.id}" target="_self">استرجاع</button></div>`).join('') : '<div class="empty">الأرشيف فارغ.</div>'}
        </div>
      </details>
    </div>
  </div>`;
}

function openModal(title, body, onMount) {
  $('#modal').innerHTML = `<div class="mh"><h3 class="h3">${title}</h3><button class="icon-btn" data-act="close" style="font-size:18px" target="_self">✕</button></div>${body}`;
  $('#overlay').classList.add('on');
  if (onMount) onMount($('#modal'));
}
function closeModal() { $('#overlay').classList.remove('on'); stopMic(); }
function confirmBox(msg) {
  return new Promise(res => {
    openModal('تأكيد', `<p>${esc(msg)}</p><div class="mfoot"><button class="btn btn-ghost" id="cf-no" target="_self">إلغاء</button><button class="btn btn-navy" id="cf-yes" style="background:var(--crimson)" target="_self">نعم</button></div>`);
    $('#cf-no').onclick = () => { closeModal(); res(false); };
    $('#cf-yes').onclick = () => { closeModal(); res(true); };
  });
}
const sectionOptions = sel => Object.keys(SECTIONS).map(k => `<option ${k === sel ? 'selected' : ''}>${k}</option>`).join('');
const peopleList = () => `<datalist id="dl-people">${[...new Set(D.people.map(p => p.name).concat(D.agreements.map(a => a.person)))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;

function agreementForm(a, presetSection) {
  const isNew = !a;
  a = a || { section: presetSection || 'الإدارة', person: '', track: '', handed: '', expected: '', dueDate: '', dueNote: '', status: 'جديد' };
  const its = isNew ? [] : itemsOf(a.id);
  openModal(isNew ? 'اتفاق جديد' : 'تعديل الاتفاق', `
    <form id="f-agr">
      <div class="f2">
        <div class="field"><label>القسم</label><select class="inp" name="section">${sectionOptions(a.section)}</select></div>
        <div class="field"><label>الشخص المعني</label><input class="inp" name="person" list="dl-people" value="${esc(a.person)}" required>${peopleList()}</div>
      </div>
      <div class="field"><label>المسار (اختياري)</label><input class="inp" name="track" value="${esc(a.track)}" placeholder="مثال: مسار التعلّم"></div>
      <div class="field"><label>ماذا سُلِّم له / السياق</label><textarea class="inp" name="handed" rows="2">${esc(a.handed)}</textarea></div>
      <div class="field"><label>ماذا اتفقنا (خلاصة)</label><textarea class="inp" name="expected" rows="2" required>${esc(a.expected)}</textarea></div>
      <div class="field"><label>البنود — كل مطلوب منفصل يُعلَّم «نُفذ» وحده</label>
        <div id="edit-items">${its.map(i => `<div class="edit-item" data-iid="${i.id}"><input type="checkbox" ${i.done ? 'checked' : ''} title="نُفذ"><input type="text" class="inp" value="${esc(i.text)}"><button type="button" class="btn-red" data-rm target="_self">✕</button></div>`).join('')}</div>
        <textarea class="inp" name="newItems" rows="3" placeholder="${isNew ? 'اكتب كل بند في سطر مستقل…' : 'بنود إضافية: كل بند في سطر…'}"></textarea>
      </div>
      <div class="f2">
        <div class="field"><label>تاريخ الاستحقاق</label><input class="inp" type="date" name="dueDate" value="${esc(a.dueDate)}"></div>
        <div class="field"><label>ملاحظة الموعد</label><input class="inp" name="dueNote" value="${esc(a.dueNote)}" placeholder="مثال: الاختيار بحلول الأربعاء"></div>
      </div>
      <div class="field"><label>الحالة</label><select class="inp" name="status">${STATUSES.map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="mfoot"><span>${isNew ? '' : `<button type="button" class="btn-red" id="agr-del" target="_self">حذف الاتفاق</button>`}</span>
        <span class="row"><button type="button" class="btn btn-ghost" data-act="close" target="_self">إلغاء</button><button class="btn btn-navy" target="_self">حفظ</button></span></div>
    </form>`, m => {
      m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => b.parentElement.remove());
      const del = m.querySelector('#agr-del'); if (del) del.onclick = () => { closeModal(); deleteAgreement(a.id); };
      m.querySelector('#f-agr').onsubmit = e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const row = Object.assign({}, a, {
          id: a.id || uid('a'), section: f.get('section'), person: f.get('person').trim(), track: f.get('track').trim(),
          handed: f.get('handed').trim(), expected: f.get('expected').trim(), dueDate: f.get('dueDate'), dueNote: f.get('dueNote').trim(),
          status: f.get('status'), createdAt: a.createdAt || nowIso(), updatedAt: nowIso(), archivedAt: a.archivedAt || ''
        });
        const ops = [];
        const keep = [];
        m.querySelectorAll('#edit-items .edit-item').forEach((el, idx) => {
          const old = its.find(i => i.id === el.dataset.iid);
          const done = el.querySelector('input[type=checkbox]').checked;
          const text = el.querySelector('input[type=text]').value.trim();
          keep.push(old.id);
          if (!text) return;
          ops.push({ op: 'upsert', table: 'items', row: Object.assign({}, old, { text, done, doneAt: done ? (old.doneAt || nowIso()) : '', order: idx + 1 }) });
        });
        its.filter(i => !keep.includes(i.id)).forEach(i => ops.push({ op: 'delete', table: 'items', id: i.id }));
        let n = keep.length;
        f.get('newItems').split('\n').map(s => s.replace(/^[\s\-•*\d.)]+/, '').trim()).filter(Boolean).forEach(text => {
          ops.push({ op: 'upsert', table: 'items', row: { id: uid('i'), agreementId: row.id, text, done: false, doneAt: '', order: ++n } });
        });
        ops.unshift({ op: 'upsert', table: 'agreements', row });
        closeModal();
        save(ops, isNew ? 'أُضيف الاتفاق' : 'حُفظ التعديل');
      };
    });
}

   الإملاء الصوتي والاستخراج الذكي
   ===================================================================== */
let REC = null;
function stopMic() { if (REC) { try { REC.stop(); } catch (e) {} REC = null; } const b = $('#mic'); if (b) b.classList.remove('rec'); }
function toggleMic() {
  if (REC) { stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hint = $('#mic-hint');
  if (!SR) { hint.textContent = 'الإملاء غير مدعوم في هذا المتصفح. استخدم زر الميكروفون في لوحة مفاتيح الهاتف داخل مربع النص.'; return; }
  const ta = $('#cap-text');
  REC = new SR(); REC.lang = 'ar'; REC.continuous = true; REC.interimResults = true;
  let base = ta.value ? ta.value.trim() + '\n' : '';
  REC.onresult = ev => {
    let fin = '', interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i]; if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript;
    }
    base += fin; ta.value = base + interim;
  };
  REC.onerror = ev => {
    hint.textContent = ev.error === 'not-allowed' || ev.error === 'service-not-allowed'
      ? 'المتصفح منع الميكروفون هنا (يحدث داخل Google Sites). افتح الموقع في صفحة مستقلة، أو استخدم ميكروفون لوحة المفاتيح.'
      : 'توقف الإملاء: ' + ev.error;
    stopMic();
  };
  REC.onend = () => { if (REC) stopMic(); };
  try { REC.start(); $('#mic').classList.add('rec'); hint.textContent = '🔴 يسجّل الآن… تكلم بشكل طبيعي، واضغط مرة أخرى للإيقاف.'; }
  catch (e) { hint.textContent = 'تعذّر بدء الإملاء: ' + e.message; REC = null; }
}

function parseAI(raw) {
  let s = String(raw || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('لم أجد JSON في الرد');
  const j = JSON.parse(s.slice(a, b + 1));
  const actions = Array.isArray(j.actions) ? j.actions.slice() : [];
  // توافق مع الصيغة القديمة
  (j.agreements || []).forEach(x => actions.push(Object.assign({ type: 'add_agreement' }, x)));
  if ((j.doneItemIds || []).length) actions.push({ type: 'mark_items_done', ids: j.doneItemIds });
  (j.doneAgreementIds || []).forEach(id => actions.push({ type: 'update_agreement', id, fields: { status: 'منجز' } }));
  (j.tasks || []).forEach(x => actions.push(Object.assign({ type: 'add_task' }, x)));
  return { reply: j.reply || j.notes || '', actions };
}

const isYmd = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const isHm = v => /^\d{1,2}:\d{2}$/.test(v || '');
const pickFields = (f, allowed) => { const o = {}; Object.keys(f || {}).forEach(k => { if (allowed.includes(k) && f[k] !== undefined && f[k] !== null) o[k] = String(f[k]); }); return o; };
const findIn = (W, table, id) => (W[table] || []).find(x => x.id === id);
const nameOfItem = id => { const i = D.items.find(x => x.id === id); return i ? i.text : id; };

    case 'mark_items_done': return `${ic('check', 14)} <b>نُفذ:</b> ${(a.ids || []).map(id => esc(nameOfItem(id))).join('، ')}`;

    case 'delete_task': return `<span style="color:var(--crimson)">🗑 حذف مهمة: ${esc(tk(a.id).title || a.id)}</span>`;
    case 'add_meeting': return `${ic('cal', 14)} موعد جديد: <b>${esc(a.title)}</b> ${a.kind === 'مرة واحدة' ? (isYmd(a.date) ? relDay(a.date) : 'بلا تاريخ') : 'كل ' + (DAYS[+a.weekday] || '')} ${isHm(a.start) ? fmtTime(a.start) : ''}`;
    case 'update_meeting': return `${ic('cal', 14)} تعديل موعد «${esc(mt(a.id).title || a.id)}» ← ${fl(a.fields)}`;

function actionsToOps(actions) {
  const W = JSON.parse(JSON.stringify(D));
  const ops = [];
  const put = (table, row) => { applyLocal(W, [{ op: 'upsert', table, row }]); ops.push({ op: 'upsert', table, row: Object.assign({}, row) }); };
  const del = (table, id) => { applyLocal(W, [{ op: 'delete', table, id }]); ops.push({ op: 'delete', table, id }); };
  const touchedAgr = new Set();
  const secOk = s => SECTIONS[s] ? s : null;
  actions.forEach(a => {
    switch (a.type) {
      case 'add_agreement': {
        const id = uid('a');
        put('agreements', { id, section: secOk(a.section) || 'الإدارة', person: String(a.person || '').trim() || '—', track: a.track || '', handed: a.handed || '',
          expected: a.expected || '', dueDate: isYmd(a.dueDate) ? a.dueDate : '', dueNote: a.dueNote || '', status: 'جديد', createdAt: nowIso(), updatedAt: nowIso(), archivedAt: '' });
        (a.items || []).filter(Boolean).forEach((text, n) => put('items', { id: uid('i'), agreementId: id, text: String(text), done: false, doneAt: '', order: n + 1 }));
        break;
      }
      case 'update_agreement': {
        const x = findIn(W, 'agreements', a.id); if (!x) break;
        const f = pickFields(a.fields, ['section', 'person', 'track', 'handed', 'expected', 'dueDate', 'dueNote', 'status']);
        if (f.section && !SECTIONS[f.section]) delete f.section;
        if (f.status && !STATUSES.includes(f.status)) delete f.status;
        if ('dueDate' in f && f.dueDate && !isYmd(f.dueDate)) delete f.dueDate;
        put('agreements', Object.assign({}, x, f, { updatedAt: nowIso() }));
        break;
      }
      case 'add_items': {
        const x = findIn(W, 'agreements', a.agreementId); if (!x) break;
        let n = W.items.filter(i => i.agreementId === x.id).length;
        (a.items || []).filter(Boolean).forEach(text => put('items', { id: uid('i'), agreementId: x.id, text: String(text), done: false, doneAt: '', order: ++n }));
        touchedAgr.add(x.id);
        break;
      }
      case 'mark_items_done': case 'unmark_items': {
        const done = a.type === 'mark_items_done';
        (a.ids || []).forEach(id => { const i = findIn(W, 'items', id); if (!i) return; put('items', Object.assign({}, i, { done, doneAt: done ? nowIso() : '' })); touchedAgr.add(i.agreementId); });
        break;
      }
      case 'archive_agreements': (a.ids || []).forEach(id => { const x = findIn(W, 'agreements', id); if (x) put('agreements', Object.assign({}, x, { archivedAt: nowIso() })); }); break;
      case 'delete_agreement': { const x = findIn(W, 'agreements', a.id); if (!x) break; W.items.filter(i => i.agreementId === x.id).forEach(i => del('items', i.id)); del('agreements', x.id); break; }
      case 'add_task': put('tasks', { id: uid('t'), title: String(a.title || '').trim(), date: isYmd(a.date) ? a.date : today(), done: false, doneAt: '' }); break;
      case 'complete_tasks': (a.ids || []).forEach(id => { const x = findIn(W, 'tasks', id); if (x) put('tasks', Object.assign({}, x, { done: true, doneAt: nowIso() })); }); break;
      case 'update_task': { const x = findIn(W, 'tasks', a.id); if (!x) break; const f = pickFields(a.fields, ['title', 'date']); if (f.date && !isYmd(f.date)) delete f.date; put('tasks', Object.assign({}, x, f)); break; }
      case 'delete_task': if (findIn(W, 'tasks', a.id)) del('tasks', a.id); break;
      case 'add_meeting': {
        const kind = KINDS.includes(a.kind) ? a.kind : 'مرة واحدة';
        put('meetings', { id: uid('m'), title: String(a.title || 'موعد'), person: a.person || '', section: secOk(a.section) || 'شخصي', kind,
          weekday: kind === 'مرة واحدة' ? '' : String(a.weekday ?? ''), date: kind === 'مرة واحدة' && isYmd(a.date) ? a.date : '',
          start: isHm(a.start) ? a.start : '', end: isHm(a.end) ? a.end : '', prep: a.prep || '', calEventId: '' });
        break;
      }
      case 'update_meeting': {
        const x = findIn(W, 'meetings', a.id); if (!x) break;
        const f = pickFields(a.fields, ['title', 'person', 'section', 'kind', 'weekday', 'date', 'start', 'end', 'prep']);
        if (f.date && !isYmd(f.date)) delete f.date;
        ['start', 'end'].forEach(k => { if (k in f && f[k] && !isHm(f[k])) delete f[k]; });
        if (f.section && !SECTIONS[f.section]) delete f.section;
        if (f.kind && !KINDS.includes(f.kind)) delete f.kind;
        put('meetings', Object.assign({}, x, f));
        break;
      }
      case 'delete_meeting': if (findIn(W, 'meetings', a.id)) del('meetings', a.id); break;
      case 'add_book': put('books', { id: uid('b'), title: String(a.title || ''), owner: a.owner || '', stage: STAGES.includes(a.stage) ? a.stage : STAGES[0], note: a.note || '', updatedAt: nowIso() }); break;
      case 'update_book': { const x = findIn(W, 'books', a.id); if (!x) break; const f = pickFields(a.fields, ['title', 'owner', 'stage', 'note']); if (f.stage && !STAGES.includes(f.stage)) delete f.stage; put('books', Object.assign({}, x, f, { updatedAt: nowIso() })); break; }
      case 'add_person': {
        const order = Math.max(0, ...W.people.map(p => +p.order || 0)) + 1;
        put('people', { id: uid('p'), name: String(a.name || '').trim(), section: secOk(a.section) || '', match: a.match === 'قسم' ? 'قسم' : 'شخص', order,
          phone: a.phone || '', telegram: a.telegram || '', bale: a.bale || '', preferred: ['whatsapp', 'telegram', 'bale'].includes(a.preferred) ? a.preferred : '', role: a.role || '', home: a.home === 'نعم' ? 'نعم' : 'لا' });
        break;
      }
      case 'update_person': { const x = findIn(W, 'people', a.id); if (!x) break; put('people', Object.assign({}, x, pickFields(a.fields, ['name', 'section', 'phone', 'telegram', 'bale', 'preferred', 'role', 'home', 'match']))); break; }
    }
  });
  touchedAgr.forEach(aid => {
    const x = findIn(W, 'agreements', aid); if (!x) return;
    const st = autoStatus(x, W.items.filter(i => i.agreementId === aid));
    put('agreements', Object.assign({}, x, { status: st, updatedAt: nowIso() }));
  });
  // آخر عملية على كل سجل هي المعتمدة
  const map = new Map();
  ops.forEach(o => map.set(o.table + ':' + (o.op === 'delete' ? o.id : o.row.id), o));
  return [...map.values()];
}

function personOf(name) {
  const n = String(name || '').trim();
  if (!n) return null;
  return D.people.find(x => x.name === n) || D.people.find(x => x.name.includes(n) || n.includes(x.name)) || null;
}
const digits = v => { let d = String(v || '').replace(/[^\d+]/g, ''); if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2); return d; };
const CH_LABEL = { whatsapp: 'واتساب', telegram: 'تلغرام', bale: 'بله' };
// قائمة وسائل الشخص، والمفضلة أولاً
function channelsOf(p) {
  if (!p) return [];
  const list = [];
  if (p.phone) list.push({ kind: 'whatsapp', value: p.phone });
  if (p.telegram) list.push({ kind: 'telegram', value: p.telegram });
  if (p.bale) list.push({ kind: 'bale', value: p.bale });
  const pref = p.preferred && list.find(c => c.kind === p.preferred);
  return pref ? [pref].concat(list.filter(c => c !== pref)) : list;
}
const contactOf = name => { const c = channelsOf(personOf(name))[0]; return c ? c.value : ''; };
function contactKind(c) {
  if (!c) return 'none';
  if (/^@|t\.me\//i.test(c)) return 'telegram';
  return /\d{6,}/.test(digits(c)) ? 'whatsapp' : 'none';
}
function waLink(phone, text) { return 'https://wa.me/' + digits(phone) + '?text=' + encodeURIComponent(text || ''); }
function tgLink(v) {
  v = String(v || '').trim();
  if (/t\.me\//i.test(v)) return 'https://t.me/' + v.replace(/^.*t\.me\//i, '');
  if (v.startsWith('@')) return 'https://t.me/' + v.slice(1);
  return 'https://t.me/+' + digits(v);
}
function openUrl(u) {
  const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
async function copySilently(text) { try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; } }
async function shareText(text) {
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copyText(text);
}
// via: whatsapp | telegram | bale | share | whatsapp-pick ؛ value: الرقم أو الاسم المستخدم
async function openMessage(person, text, via, value) {
  if (!via) { const c = channelsOf(personOf(person))[0]; via = c ? c.kind : 'share'; value = c ? c.value : ''; }
  if (via === 'whatsapp') { openUrl(waLink(value, text)); return; }
  if (via === 'whatsapp-pick') { openUrl('https://wa.me/?text=' + encodeURIComponent(text)); return; }
  if (via === 'telegram') {
    await copySilently(text);
    toast('✓ نُسخت الرسالة — الصقها في محادثة تلغرام');
    openUrl(value ? tgLink(value) : 'https://t.me/share/url?url=' + encodeURIComponent(text));
    return;
  }
  if (via === 'bale') {
    await copySilently(text);
    toast('✓ نُسخت الرسالة — اختر «بله» ثم الصقها');
    shareText(text);
    return;
  }
  shareText(text);
}
const openWhatsApp = (person, text) => openMessage(person, text);

function waTemplateAgr(a) {
  const rest = itemsOf(a.id).filter(i => !i.done).map(i => '• ' + i.text);
  const hon = /^(الشيخ|الحاج|السيد|آقاي|اقاى|الأستاذ|أستاذ|الدكتور)/.test(a.person || '') ? '' : 'أخي ';
  return `السلام عليكم ${a.person ? hon + a.person : ''}،\nتذكير لطيف بما اتفقنا عليه: ${a.expected}` +
    (rest.length ? `\nالمتبقي:\n${rest.join('\n')}` : '') + (a.dueDate ? `\nالموعد: ${fmtDay(a.dueDate)}` : '') + `\nبارك الله فيك.`;
}
function waTemplateMeet(m) {
  if (m.kind === 'تذكير أسبوعي') return m.prep || m.title;
  const o = occurrence(m);
  return `السلام عليكم،\nتذكير بموعد «${m.title}» ${o ? whenText(m, o) : ''}.` + (m.prep ? `\nللتحضير: ${m.prep}` : '');
}

          .finally(() => { ai.disabled = false; ai.innerHTML = ic('sparkle', 13) + ' صياغة بجيمناي'; });

const waAiPrompt = (person, about) => `اكتب رسالة محادثة (واتساب/تلغرام) عربية قصيرة مهذبة دافئة من محمد إلى «${person}»، تبدأ بالسلام، وتذكّره دون لوم بما يلي، وتنتهي بدعاء قصير. لا تخترع معلومات.\n${about}\nأعد JSON فقط: {"message":"..."}`;

/* ملخص الأسبوع كنص للنسخ */
function weeklySummary() {
  const t = today(), ago = addDays(t, -7);
  const lines = ['ملخص الأسبوع — ' + fmtDay(ago) + ' إلى ' + fmtDay(t), ''];
  const persons = [...new Set(activeAgr().map(a => a.person))];
  persons.forEach(per => {
    const list = activeAgr().filter(a => a.person === per);
    const done = [], left = [];
    list.forEach(a => itemsOf(a.id).forEach(i => {
      if (i.done && (i.doneAt || '').slice(0, 10) >= ago) done.push(i.text);
      else if (!i.done) left.push(i.text + (isLate(a) ? ' (متأخر)' : ''));
    }));
    list.filter(a => !itemsOf(a.id).length && isOpen(a)).forEach(a => left.push(a.expected));
    if (!done.length && !left.length) return;
    lines.push('▪️ ' + per);
    done.forEach(x => lines.push('   ✅ ' + x));
    left.forEach(x => lines.push('   ⏳ ' + x));
    lines.push('');
  });
  return lines.join('\n');
}

    const k = f.key.value.trim(), m = f.model.value.trim();
    api.setGeminiKey(k, m).then(s => { D.settings = s; render(); toast('✓ حُفظت إعدادات جيمناي'); }).catch(err => toast('⚠️ ' + err));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'people-filter') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('[data-person-card]').forEach(c => { c.style.display = !q || c.dataset.personCard.includes(q) ? '' : 'none'; });
  }
});
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
$('#fab').addEventListener('click', e => { e.preventDefault(); quickMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// تحديث تلقائي كل 5 دقائق (للاجتماعات والتذكيرات، ولو عدّلت من جهاز آخر)
setInterval(() => { if (!pending && !$('#overlay').classList.contains('on')) reload(); }, 5 * 60 * 1000);

renderChrome();
(function start() {
  const c = !DEMO && getToken() ? cacheLoad() : null;
  if (c) { D = c; render(); }
  reload();
})();
if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
